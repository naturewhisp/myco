name: Android

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - uses: android-actions/setup-android@v3
      - run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - run: ./gradlew lintDebug --max-workers=1
      - run: ./gradlew compileDebugKotlin --max-workers=1
      - run: ./gradlew testDebugUnitTest --max-workers=1
      - run: ./gradlew assembleDebug --max-workers=1
      - uses: actions/upload-artifact@v4
        with:
          name: myco-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
