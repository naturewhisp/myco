name: KMP Core

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - uses: android-actions/setup-android@v3
        with:
          packages: ''
      - run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - run: ./gradlew :core:compileAndroidMain :core:testAndroidHostTest --max-workers=1

  apple:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - uses: android-actions/setup-android@v3
        with:
          packages: ''
      - run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - run: ./gradlew :core:linkDebugFrameworkIosArm64 :core:linkDebugFrameworkIosSimulatorArm64 :core:iosSimulatorArm64Test --max-workers=1
